<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <h1>🎮 Tic Tac Toe</h1>
    <p class="subtitle">Take turns and get three in a row to win!</p>

    <div class="status" id="status" aria-live="polite">Player X's turn</div>

    <div class="board" id="board" role="grid" aria-label="Tic Tac Toe board">
      <button class="cell" data-index="0" aria-label="Cell 1"></button>
      <button class="cell" data-index="1" aria-label="Cell 2"></button>
      <button class="cell" data-index="2" aria-label="Cell 3"></button>
      <button class="cell" data-index="3" aria-label="Cell 4"></button>
      <button class="cell" data-index="4" aria-label="Cell 5"></button>
      <button class="cell" data-index="5" aria-label="Cell 6"></button>
      <button class="cell" data-index="6" aria-label="Cell 7"></button>
      <button class="cell" data-index="7" aria-label="Cell 8"></button>
      <button class="cell" data-index="8" aria-label="Cell 9"></button>
    </div>

    <div class="scoreboard">
      <div><span class="player-x">Player X</span><strong id="scoreX">0</strong></div>
      <div><span class="player-o">Player O</span><strong id="scoreO">0</strong></div>
      <div><span>Draws</span><strong id="draws">0</strong></div>
    </div>

    <div class="controls">
      <button id="restartRound" class="secondary">Restart Round</button>
      <button id="resetGame" class="primary">Reset Scores</button>
    </div>
    <p class="footer">Made with HTML, CSS & JavaScript</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
